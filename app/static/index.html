<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProcureAI</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #16202c; --muted: #5d6b7a; --line: #dfe4ea;
    --accent: #0f5fd7; --accent-ink: #ffffff; --good: #14804a; --warn: #a15c00; --bad: #b3261e;
    --quoted: #8aa4c8; --hidden: #d9822b; --estimated: #c9456b; --delay: #7a5cc4; --benefit: #14804a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11161c; --card: #1a212a; --ink: #e7ecf2; --muted: #98a6b5; --line: #2c3743;
      --accent: #5b9bff; --accent-ink: #0b1220; --good: #4cc38a; --warn: #e5a54b; --bad: #ff7b72; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0; } h2 { font-size: 16px; margin: 0 0 12px; } h3 { font-size: 14px; margin: 16px 0 6px; }
  .sub { color: var(--muted); margin: 2px 0 20px; }
  nav a { color: var(--muted); text-decoration: none; margin-right: 14px; padding-bottom: 2px; }
  nav a.on { color: var(--ink); font-weight: 600; border-bottom: 2px solid var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 16px; }
  .items-head, .item-row { display: grid; gap: 10px; grid-template-columns: 1fr 130px 34px; align-items: center; }
  .item-row { margin-bottom: 8px; } .item-row button { padding: 6px 0; }
  td.best { font-weight: 700; } td.nq { color: var(--muted); }
  .split { border-left: 4px solid var(--accent); }
  a.dl { float: right; font-size: 13px; font-weight: 600; color: var(--accent); text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; }
  a.dl:hover { border-color: var(--accent); }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input[type=text], input[type=number] { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
  .weights { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 12px; }
  .drop { margin-top: 14px; border: 2px dashed var(--line); border-radius: 10px; padding: 22px; text-align: center; color: var(--muted); cursor: pointer; }
  .drop.over { border-color: var(--accent); color: var(--ink); }
  .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; padding: 9px 16px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  #status { color: var(--muted); } #status.err { color: var(--bad); }
  .rec { border-left: 4px solid var(--good); }
  .rec .name { font-size: 20px; font-weight: 700; }
  .rec p { margin: 8px 0; white-space: pre-line; }
  .pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; border: 1px solid currentColor; }
  .high { color: var(--bad); } .medium { color: var(--warn); } .low { color: var(--muted); } .ok { color: var(--good); }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  th:nth-child(-n+2), td:nth-child(-n+2) { text-align: left; }
  tr.top td { font-weight: 600; }
  .bars .row { display: grid; grid-template-columns: 210px 1fr 90px; gap: 10px; align-items: center; margin: 7px 0; }
  .bars .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { display: flex; height: 18px; border-radius: 4px; overflow: hidden; background: var(--bg); }
  .bar span { height: 100%; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
  details { border-top: 1px solid var(--line); padding: 10px 0; }
  details:first-of-type { border-top: 0; }
  summary { cursor: pointer; font-weight: 600; }
  summary small { font-weight: 400; color: var(--muted); margin-left: 8px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  ul { margin: 4px 0; padding-left: 18px; } li { margin: 3px 0; }
  .ev { color: var(--muted); font-size: 12px; white-space: normal; }
  .trace { font-size: 13px; color: var(--muted); } .trace b { color: var(--ink); font-weight: 600; }
  @media (max-width: 720px) { .grid, .cols, .weights { grid-template-columns: 1fr 1fr; } .grid > :first-child { grid-column: 1 / -1; } .cols { grid-template-columns: 1fr; } .bars .row { grid-template-columns: 110px 1fr 70px; } }
</style>
</head>
<body>
<main>
  <div style="display:flex;align-items:baseline;gap:20px;flex-wrap:wrap"><h1>ProcureAI</h1>
    <nav><a class="on" href="/">Compare quotations</a><a href="/suppliers">Suppliers</a></nav></div>
  <p class="sub">Upload supplier quotations. The agents work out what each one really costs, how likely it is to arrive late, and which to award.</p>

  <section class="card">
    <h2>Request for quotation</h2>
    <div class="items-head"><label>Item</label><label>Quantity</label><span></span></div>
    <div id="items"></div>
    <div class="actions" style="margin-top:8px">
      <button id="add" type="button">+ Add item</button>
      <label for="days" style="margin:0 0 0 auto">Needed in (days)</label><input id="days" type="number" min="1" value="30" style="width:90px">
    </div>
    <div class="weights">
      <div><label for="w_cost">Weight: cost</label><input id="w_cost" type="number" min="0" step="5" value="45"></div>
      <div><label for="w_risk">Weight: delivery risk</label><input id="w_risk" type="number" min="0" step="5" value="25"></div>
      <div><label for="w_rel">Weight: reliability</label><input id="w_rel" type="number" min="0" step="5" value="20"></div>
      <div><label for="w_lead">Weight: lead time</label><input id="w_lead" type="number" min="0" step="5" value="10"></div>
    </div>
    <div class="drop" id="drop">Drop quotations here (PDF, scan, photo or text) or click to choose<div id="filelist"></div></div>
    <input id="files" type="file" multiple accept=".txt,.pdf,.png,.jpg,.jpeg,.tif,.tiff,.bmp,.webp" hidden>
    <div class="actions">
      <button class="primary" id="run" disabled>Compare quotations</button>
      <span class="low">or try a sample set:</span><span id="samples"></span>
      <span id="status"></span>
    </div>
  </section>

  <div id="out"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const usd = n => (n < 0 ? "−$" : "$") + Math.abs(Math.round(n)).toLocaleString("en-US");
const pct = n => Math.round(n * 100) + "%";
let picked = [];

function addItem(item = "", quantity = "") {
  const row = document.createElement("div"); row.className = "item-row";
  const name = Object.assign(document.createElement("input"), { type: "text", value: item, placeholder: "e.g. Hex nut M10, DIN 934, grade 8" });
  const qty = Object.assign(document.createElement("input"), { type: "number", min: 1, value: quantity });
  const del = Object.assign(document.createElement("button"), { type: "button", textContent: "×", title: "Remove item" });
  name.setAttribute("aria-label", "Item"); qty.setAttribute("aria-label", "Quantity");
  del.onclick = () => { if ($("items").children.length > 1) row.remove(); };
  row.append(name, qty, del); $("items").append(row);
}
function setItems(lines) { $("items").replaceChildren(); lines.forEach(l => addItem(l.item, l.quantity)); }
function rfq() {
  const lines = [...$("items").children].map(r => ({ item: r.children[0].value.trim(), quantity: +r.children[1].value }))
    .filter(l => l.item && l.quantity > 0);
  return {
    lines, needed_in_days: +$("days").value || null,
    weights: { cost: +$("w_cost").value, delivery_risk: +$("w_risk").value, reliability: +$("w_rel").value, lead_time: +$("w_lead").value },
  };
}
function setFiles(list) {
  picked = [...list];
  $("filelist").textContent = picked.length ? picked.map(f => f.name).join(", ") : "";
  $("run").disabled = !picked.length;
}
$("add").onclick = () => addItem();
setItems([{ item: "Industrial servo motor 400W", quantity: 500 }]);
$("drop").onclick = () => $("files").click();
$("files").onchange = e => setFiles(e.target.files);
$("drop").ondragover = e => { e.preventDefault(); $("drop").classList.add("over"); };
$("drop").ondragleave = () => $("drop").classList.remove("over");
$("drop").ondrop = e => { e.preventDefault(); $("drop").classList.remove("over"); setFiles(e.dataTransfer.files); };

async function call(url, options) {
  $("status").className = ""; $("status").textContent = "Agents working…";
  $("run").disabled = true; document.querySelectorAll("#samples button").forEach(b => b.disabled = true);
  try {
    const res = await fetch(url, options);
    const body = await res.json();
    if (!res.ok) throw new Error(typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail));
    render(body);
    $("status").textContent = "Run #" + body.run_id + " complete.";
  } catch (err) {
    $("status").className = "err"; $("status").textContent = err.message;
  } finally {
    document.querySelectorAll("#samples button").forEach(b => b.disabled = false); $("run").disabled = !picked.length;
  }
}
fetch("/api/samples").then(r => r.json()).then(sets => sets.forEach(set => {
  const b = document.createElement("button");
  b.textContent = set.label;
  b.onclick = () => {
    // a sample set comes with the RFQ it answers; the weights stay as entered
    setItems(set.rfq.lines.length ? set.rfq.lines : [{ item: set.rfq.item, quantity: set.rfq.quantity }]); $("days").value = set.rfq.needed_in_days;
    call("/api/compare/samples/" + set.name, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(rfq()) });
  };
  $("samples").append(b, " ");
}));
$("run").onclick = () => {
  const r = rfq(), fd = new FormData();
  picked.forEach(f => fd.append("files", f));
  if (!r.lines.length) { $("status").className = "err"; $("status").textContent = "Add at least one item with a quantity."; return; }
  fd.append("lines", JSON.stringify(r.lines));
  if (r.needed_in_days) fd.append("needed_in_days", r.needed_in_days);
  fd.append("weights", JSON.stringify(r.weights));
  call("/api/compare", { method: "POST", body: fd });
};

const COLORS = { quoted: "var(--quoted)", hidden: "var(--hidden)", estimated: "var(--estimated)", delay: "var(--delay)" };

function render(d) {
  const rec = d.recommendation, quotes = d.quotes;
  const max = Math.max(...quotes.map(q => q.risk_adjusted_usd));
  const conf = { high: "ok", moderate: "medium", low: "high" }[rec.confidence] || "low";

  const bars = quotes.map(q => {
    const sum = s => q.cost.components.filter(c => c.status === s && c.amount > 0).reduce((a, c) => a + c.amount, 0);
    const parts = [["quoted", sum("quoted")], ["hidden", sum("hidden")], ["estimated", sum("estimated")], ["delay", q.delay_cost_usd]];
    return `<div class="row"><div class="lbl" title="${esc(q.supplier_name)}">${esc(q.supplier_name)}</div>
      <div class="bar">${parts.map(([k, v]) => `<span style="width:${(v / max * 100).toFixed(2)}%;background:${COLORS[k]}" title="${k}: ${usd(v)}"></span>`).join("")}</div>
      <div style="text-align:right">${usd(q.risk_adjusted_usd)}</div></div>`;
  }).join("");

  const multi = d.lines.length > 1;
  const up = n => "$" + (n < 1 ? n.toFixed(4) : n.toFixed(2));
  // one row per requested item, one column per supplier; the lowest price in each row is marked
  const matrix = !multi ? "" : `<section class="card"><h2>Unit price by item</h2><div class="scroll"><table>
      <tr><th>Item</th><th>Quantity</th>${quotes.map(q => `<th>${esc(q.supplier_name.split(" ").slice(0, 2).join(" "))}</th>`).join("")}</tr>
      ${d.lines.map((ln, i) => {
        const offers = quotes.map(q => q.lines[i]);
        const low = Math.min(...offers.filter(o => o.quoted).map(o => o.unit_price_usd));
        return `<tr><td style="white-space:normal;min-width:230px">${esc(ln.item)}</td><td style="text-align:right">${ln.quantity.toLocaleString("en-US")}</td>${offers.map(o =>
          !o.quoted ? `<td class="nq">not quoted</td>` : `<td class="${o.unit_price_usd === low ? "best" : ""}">${up(o.unit_price_usd)}${o.unit_price_usd === low ? " ✓" : ""}</td>`).join("")}</tr>`;
      }).join("")}</table></div>
      <p class="low" style="margin:10px 0 0;font-size:12.5px">USD per piece, before freight, duty and other charges. ✓ marks the lowest quoted price for each item.</p></section>`;
  const sp = d.split_award;
  const split = !sp ? "" : `<section class="card split"><h2>Split-award option: save ${usd(sp.saving_vs_recommended_usd)} by using ${sp.suppliers.length} suppliers</h2>
      <div class="scroll"><table><tr><th>Supplier</th><th style="text-align:left">Items</th><th>Cost</th><th>P(late)</th><th>Lead</th></tr>
      ${sp.suppliers.map(s => `<tr><td>${esc(s.supplier_name)}</td><td style="text-align:left;white-space:normal">${s.items.map(esc).join("<br>")}</td>
        <td>${usd(s.cost_usd)}</td><td>${pct(s.p_late)}</td><td>${s.lead_days} d</td></tr>`).join("")}
      <tr class="top"><td>Split total</td><td></td><td>${usd(sp.total_usd)}</td><td></td><td>${sp.slowest_lead_days} d</td></tr></table></div>
      <p class="low" style="margin:10px 0 0;font-size:12.5px">Risk-adjusted, with each supplier's fixed charges counted in full. Compared with ${usd(sp.recommended_award_usd)} for the recommended single award (${esc(d.recommendation.supplier_name)})${sp.single_award_supplier !== d.recommendation.supplier_name ? ` and ${usd(sp.single_award_usd)} for the cheapest single award (${esc(sp.single_award_supplier)})` : ""}. The trade-off is two orders, two deliveries and two suppliers to manage.</p></section>`;
  const rows = quotes.map(q => `<tr class="${q.rank === 1 ? "top" : ""}">
      <td>${q.held ? "–" : q.rank}</td><td>${esc(q.supplier_name)}${q.held ? ' <span class="pill high">held</span>' : ""}</td>
      ${multi ? `<td>${q.cost.coverage.quoted} of ${q.cost.coverage.requested}</td>` : ""}
      <td>${usd(q.cost.headline_usd)} <small class="low">#${q.headline_rank}</small></td>
      <td>${usd(q.cost.landed_usd)}</td><td>${usd(q.risk_adjusted_usd)}</td>
      <td class="${q.risk.p_late >= .35 ? "high" : q.risk.p_late >= .2 ? "medium" : "ok"}">${pct(q.risk.p_late)}</td>
      <td>${q.risk.lead_days} d</td>
      <td>${q.intel.matched ? pct(q.intel.profile.on_time_rate) : "n/a"}</td>
      <td>${q.scores.total.toFixed(1)}</td></tr>`).join("");

  const details = quotes.map(q => {
    const comps = q.cost.components.map(c => `<tr><td colspan="2" style="text-align:left;white-space:normal">${esc(c.label)}
        ${c.status !== "quoted" ? `<span class="pill ${c.status === "benefit" ? "ok" : c.status === "unquantified" ? "low" : "medium"}">${c.status}</span>` : ""}
        ${c.evidence ? `<div class="ev">${esc(c.evidence)}</div>` : ""}</td><td>${usd(c.amount)}</td></tr>`).join("");
    const flags = q.flags.map(f => `<li><span class="pill ${f.severity}">${f.severity}</span> ${esc(f.text)}</li>`).join("") || "<li class='low'>None</li>";
    const drivers = q.risk.drivers.map(x => `<li>${esc(x.label)}${x.value != null ? ` (${x.value})` : ""}: <span class="${x.effect === "raises risk" ? "high" : "ok"}">${x.effect}</span></li>`).join("");
    const levers = q.negotiation_levers.map(l => `<li>${esc(l)}</li>`).join("") || "<li class='low'>None</li>";
    const s = q.scores;
    return `<details ${q.rank === 1 ? "open" : ""}><summary>${q.held ? "Held" : q.rank}. ${esc(q.supplier_name)}
      <small>${esc(q.quote.source_file)}${q.quote.parse_method.includes("ocr") ? " · read by OCR" : ""} · ${esc(q.quote.currency)} · ${esc(q.cost.incoterm_used)} · ${usd(q.cost.hidden_usd)} outside headline</small></summary>
      <div class="cols"><div>
        <h3>Landed cost</h3><table>${comps}
          <tr><td colspan="2" style="text-align:left">Expected cost of delay (${pct(q.risk.p_late)} × ${q.expected_delay_days} d expected)</td><td>${usd(q.delay_cost_usd)}</td></tr>
          <tr class="top"><td colspan="2" style="text-align:left">Risk-adjusted total</td><td>${usd(q.risk_adjusted_usd)}</td></tr></table>
        <h3>Scores</h3>
        <div class="low">Cost ${s.cost} · Delivery ${s.delivery_risk} · Reliability ${s.reliability} · Lead time ${s.lead_time}</div>
      </div><div>
        <h3>Flags</h3><ul>${flags}</ul>
        <h3>What drives the delivery-risk prediction</h3><ul>${drivers}</ul>
        <h3>Negotiation levers</h3><ul>${levers}</ul>
      </div></div></details>`;
  }).join("");

  const m = d.risk_model;
  $("out").innerHTML = `
    <section class="card rec">
      <div class="low" style="font-size:12px">RECOMMENDED AWARD</div>
      <div class="name">${esc(rec.supplier_name)} <span class="pill ${conf}">${esc(rec.confidence || "n/a")} confidence</span>
        <a class="dl" href="/api/runs/${d.run_id}/report.pdf" download>Download report (PDF)</a></div>
      <p>${esc(d.narrative)}</p>
      ${rec.before_signing.length ? `<h3>Before signing</h3><ul>${rec.before_signing.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    </section>
    <section class="card"><h2>Headline price vs. what it really costs</h2>
      <div class="bars">${bars}</div>
      <div class="legend"><span><i style="background:var(--quoted)"></i>In the quoted total</span><span><i style="background:var(--hidden)"></i>Stated but left out of the total</span>
        <span><i style="background:var(--estimated)"></i>Left to the buyer (estimated)</span><span><i style="background:var(--delay)"></i>Expected cost of delay</span></div>
    </section>
    ${split}
    ${matrix}
    <section class="card"><h2>Comparison</h2><div class="scroll"><table>
      <tr><th>#</th><th>Supplier</th>${multi ? "<th>Items quoted</th>" : ""}<th>Headline</th><th>Landed</th><th>Risk-adjusted</th><th>P(late)</th><th>Lead</th><th>On-time history</th><th>Score</th></tr>${rows}</table></div>
      ${d.rejected.length ? `<p class="high">Could not read: ${d.rejected.map(r => esc(r.file + " (" + r.reason + ")")).join("; ")}</p>` : ""}
    </section>
    <section class="card"><h2>Quote by quote</h2>${details}</section>
    <section class="card trace"><h2 style="color:var(--ink)">Agent trace</h2>
      ${d.trace.map(t => `<div><b>${esc(t.agent)}</b> — ${esc(t.summary)}</div>`).join("")}
      <p>Delivery-risk model: XGBoost, ROC AUC ${m.roc_auc.toFixed(3)} on the newest ${m.test_rows} orders (held out). Summary source: ${esc(d.narrative_source)}.</p>
    </section>`;
}
</script>
</body>
</html>
